<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PLAYER &gt; BOSS</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
  }

  /* Background Image Layer */
  .bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
  }

  .bg::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
}

  .bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
  }

  /* Content */
  .content {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #ffffff;
  }

  h1 {
    font-size: 3.2rem;
    text-transform: uppercase;
    color: #fde86c;
    text-shadow:
      4px 4px 0 #003344,
      8px 8px 0 #001122;
    animation: glitch 2s infinite;
  }

  @keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(2px, -2px); }
    60% { transform: translate(-2px, 0); }
    80% { transform: translate(2px, 0); }
    100% { transform: translate(0); }
  }

  .play-button {
    margin-top: 50px;
    font-size: 1.2rem;
    padding: 20px 50px;
    background-color: #00ffaa;
    border: 6px solid #004433;
    color: #002211;
    text-decoration: none;
    box-shadow: 6px 6px 0 #001122;
    cursor: pointer;
  }

  .play-button:hover {
    transform: scale(1.1);
    background-color: #66ffcc;
  }

  .subtitle {
  margin-top: 30px;
  font-size: 0.7rem;
  color: #000608;
  text-shadow: 0 0 6px #00ffaa;
}
</style>
</head>

<body>

<!-- BACKGROUND IMAGE -->
<div class="bg">
  <img src="background.jpg" alt="background.jpg">
</div>

<!-- CONTENT -->
<div class="content">
  <h1>PLAYER &gt; BOSS</h1>
  <a class="play-button" href="slide1.html">▶ PLAY</a>
  <div class="subtitle">INEQUALITIES ARE FOR LOSERS</div>
</div>
<script src="music.js"></script>
</body>
</html>
